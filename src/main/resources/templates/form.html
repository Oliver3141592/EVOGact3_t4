<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cita</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #eef6f7;
            color: #2c3e50;
        }
        h1 {
            color: #0e7c86;
            margin-top: 0;
        }
        .card {
            max-width: 420px;
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-top: 6px solid #0e7c86;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
            color: #0e7c86;
        }
        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #b8d8db;
            border-radius: 6px;
            background: #f9fdfd;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #0e7c86;
            box-shadow: 0 0 0 3px rgba(14,124,134,0.2);
            background: white;
        }
        button {
            margin-top: 22px;
            padding: 9px 18px;
            background: #0e7c86;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover { background: #0a5c64; }
        a.cancel {
            margin-left: 12px;
            color: #c0392b;
            font-weight: bold;
            text-decoration: none;
        }
        a.cancel:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1 th:text="${cita.id == null} ? ' Nueva cita' : ' Editar cita'"></h1>

    <div class="card">
        <form th:action="@{/guardar}" th:object="${cita}" method="post">
            <input type="hidden" th:field="*{id}">

            <label>Paciente</label>
            <input type="text" th:field="*{paciente}" required>

            <label>Fecha y hora</label>
            <input type="datetime-local" th:field="*{fechaHora}" required>

            <label>Motivo</label>
            <input type="text" th:field="*{motivo}" required>

            <div th:if="${cita.id != null}">
                <label>Estado</label>
                <select th:field="*{estado}">
                    <option value="PROGRAMADA">PROGRAMADA</option>
                    <option value="COMPLETADA">COMPLETADA</option>
                    <option value="CANCELADA">CANCELADA</option>
                </select>
            </div>

            <label>Dentista</label>
            <select th:field="*{dentista.id}" required>
                <option value="">-- Selecciona un dentista --</option>
                <option th:each="d : ${dentistas}"
                        th:value="${d.id}"
                        th:text="${d.nombre} + ' (' + ${d.especialidad} + ')'">
                </option>
            </select>

            <button type="submit">Guardar</button>
            <a class="cancel" th:href="@{/}">Cancelar</a>
        </form>
    </div>
</body>
</html>
